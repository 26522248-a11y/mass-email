<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{subject}}</title></head>
<body style="margin:0;padding:0;background:#f5f5f5">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f5f5f5">
<tr><td align="center" style="padding:24px 12px">
<table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;background:#ffffff;border-radius:8px">
<tr><td style="padding:28px;font:16px/1.55 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:#1a1a1a">
<p style="margin:0 0 16px">{{greeting}} {{name}},</p>
<p style="margin:0 0 16px">{Quick|Short} note: {we shipped|we released} the {thing|update} you asked about.</p>
<p style="margin:0 0 24px"><a href="{{url}}" style="display:inline-block;background:#111;color:#fff;padding:12px 22px;border-radius:6px;text-decoration:none">Read it here</a></p>
<p style="margin:0;color:#555;font-size:14px">{{brand}}<br>Sent to {{email}} because you opted in at {{domain}}.<br>
<a href="{{unsubscribe}}" style="color:#555">Unsubscribe</a></p>
</td></tr></table>
</td></tr></table>
</body></html>
